perEndpointCredits:
- endpoint: POST /email-validation
  credits: 1
  note: Not charged when the result is risky.
- endpoint: POST /email-finder
  credits: 10
  note: Not charged when found is false.
- endpoint: POST /reverse-lookup/lookup
  credits: 10
  note: Person enrichment; not charged when no profile is found. Results cached 7 days.
- endpoint: POST /ip-to-company
  credits: 100
  note: Not charged when no ipDomain is returned; results cached 7 days.
- endpoint: GET /reverse-lookup/phones
  credits: 500
  note: Not charged when no numbers are found.
- endpoint: POST /lead-finder/count
  credits: 0
  note: Free. Use it to size an audience before spending anything.
- endpoint: POST /lead-finder/search
  credits: 0
  note: >-
    First 3 pages OR 75 results free per search, whichever comes first, plus 50 free
    unique searches per month. From page 4, 1 credit per result returned, max 40 pages.
- endpoint: POST /lead-finder/reveal
  credits: 535
  note: >-
    10 credits with fields ["email"], 525 with ["phone"], 535 for both (the default when
    fields is omitted). Cached reveals are free. Charged asynchronously inside the worker —
    an insufficient balance fails the job rather than returning a synchronous 402.
- endpoint: POST /lead-finder/unlock-names
  credits: 1
  note: 1 credit per lead to unmask last names, up to 100 leads per call.
- endpoint: POST /count-estimate
  credits: 100
  note: Company Followers audience count estimation. Approved accounts only.
- endpoint: POST /company-follower
  credits: variable
  note: >-
    Credits reserved upfront from max_limit and settled per profile found; excess refunded.
    Approved accounts only.
- endpoint: GET /wallets/balance
  credits: 0
- endpoint: GET /wallets/transactions
  credits: 0
- endpoint: batch/bulk status and results polling
  credits: 0
  note: Polling any job status endpoint is always free.
- endpoint: Teams, saved searches, filter options, company-name suggest
  credits: 0
  note: Free endpoints.
bulk_credit_model:
  scheme: reserve-and-settle
  reserve: itemCount * creditCostPerItem, deducted at submit
  settle: >-
    On the first results fetch after the job reaches a terminal status. Only successfully
    processed items are charged; the reserved excess is refunded.
  idempotent_settlement: true
  note: >-
    Settlement is idempotent — fetching results repeatedly does not charge again. Request
    submission is NOT idempotent; there is no Idempotency-Key header.
