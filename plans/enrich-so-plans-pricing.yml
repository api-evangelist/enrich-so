description: >-
  Enrich meters every endpoint against a single prepaid credit balance rather than
  per-endpoint subscriptions. New accounts receive a one-time grant of free credits to
  start, and monthly plans buy larger credit allotments at a lower effective rate.
  Credits are deducted per call by endpoint (see the FinOps and per-endpoint costs below),
  and unsuccessful ("not found") lookups are refunded. The plan tiers and prices below are
  captured from the Enrich credits and pricing documentation and should be reconciled
  against the live pricing page, which controls.
notes: >-
  RECONCILED 2026-08-14 against the Enrich credits and pricing documentation at
  https://doc.enrich.so/credits-pricing-1951027m0 and against the per-endpoint credit costs
  published inside the OpenAPI fragments on each endpoint page. The three paid credit packs
  (Growth 100,000 credits $49/mo, Scale 500,000 credits $149/mo, Pro 2,500,000 credits
  $499/mo) and the 100 free signup credits are confirmed verbatim from that page, which also
  publishes the effective cost per credit ($0.00049, $0.000298, $0.0002). CORRECTION: an
  earlier round recorded lead reveal at 50/525/575 credits; the current published contract
  says 10 credits email-only, 525 phone-only, 535 both, and the earlier figures have been
  replaced. NOTE ON THE ENTERPRISE TIER: Enrich's own pricing page could not be read —
  https://www.enrich.so/pricing returns HTTP 429 behind a Vercel Security Checkpoint bot
  challenge for every non-browser client (probed 2026-08-14) — so the Enterprise tier below
  is carried from the rate-limits documentation, which names an Enterprise plan and its
  limits, rather than from a price list.
