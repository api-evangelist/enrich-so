    StartCountEstimateResponse:
      type: object
      required:
      - success
      - data
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/StartCountEstimateData'
        meta:
          type: object
          properties:
            requestId:
              type: string
            creditsUsed:
              type: number
              description: Credits consumed (100, or 0 if from cache)
            creditsRemaining:
              type: number
              description: Remaining credit balance
    StartCountEstimateData:
      type: object
      required:
      - batchId
      - status
      properties:
        batchId:
          type: string
          description: Unique batch ID for this estimation
        status:
          type: string
          enum:
          - pending
          - completed
          description: Job status — pending (queued) or completed (from cache)
        message:
          type: string
          description: Human-readable status message
        fromCache:
          type: boolean
          description: Whether result was served from cache (no credits charged)
        cachedAt:
          type: string
          format: date-time
          description: When the cached result was originally computed
        data:
          $ref: '#/components/schemas/CountEstimateResultData'
          description: Result data (only present if returned from cache)
    CountEstimateStatusData:
      type: object
      required:
      - batchId
      - status
      - companyUrl
      - createdAt
      properties:
        batchId:
          type: string
          description: Batch ID
        status:
          type: string
          enum:
          - pending
          - in_progress
          - completed
          - failed
          - cancelled
          description: Current job status
        companyUrl:
          type: string
          description: LinkedIn company URL
        message:
          type: string
          description: Human-readable status message
        createdAt:
          type: string
          format: date-time
          description: When the job was created
        completedAt:
          type: string
          format: date-time
          description: When the job completed
          nullable: true
        data:
          $ref: '#/components/schemas/CountEstimateResultData'
          description: Result data (when completed)
    CountEstimateResultData_2:
      type: object
      required:
      - totalCount
      properties:
        totalCount:
          type: integer
          description: Total estimated follower count
        functionBreakdown:
          type: array
          items:
            $ref: '#/components/schemas/FunctionBreakdownItem_2'
          description: Breakdown by department/function (if departments filter was applied)
          nullable: true
        seniorityBreakdown:
          type: array
          items:
            $ref: '#/components/schemas/SeniorityBreakdownItem_2'
          description: Breakdown by seniority level (if levels filter was applied)
          nullable: true
        filtersApplied:
          type: object
          properties:
            countries:
              type: array
              items:
                type: string
            states:
              type: array
              items:
                type: string
              description: State/province filters applied
            jobTitles:
              type: array
              items:
                type: string
            departments:
              type: array
              items:
                type: string
            levels:
              type: array
              items:
                type: string
          description: Filters applied to the estimation
          x-apidog-orders:
          - countries
          - states
          - jobTitles
          - departments
          - levels
          x-apidog-ignore-properties: []
          nullable: true
      x-apidog-orders:
      - totalCount
      - functionBreakdown
      - seniorityBreakdown
      - filtersApplied
      x-apidog-ignore-properties: []
      x-apidog-folder: ''
    SeniorityBreakdownItem_2:
      type: object
      required:
      - seniorityLevel
      - seniorityId
      - count
      - percentage
      properties:
        seniorityLevel:
          type: string
          description: Seniority level name (e.g., Director)
        seniorityId:
          type: string
          description: Seniority level ID
        count:
          type: integer
          description: Count of people at this seniority
        percentage:
          type: number
          description: Percentage of total
      x-apidog-orders:
      - seniorityLevel
      - seniorityId
      - count
      - percentage
      x-apidog-ignore-properties: []
      x-apidog-folder: ''
    ErrorEnvelope_2:
      type: object
      description: RFC 9457 Problem Details error response.
      required:
      - type
      - title
      - status
      properties:
        type:
          type: string
          format: uri
          description: URI reference that identifies the problem type.
          examples:
          - https://dev.enrich.so/errors/validation-error
        title:
          type: string
          description: Short, human-readable summary of the problem.
          examples:
          - Validation Error
        status:
          type: integer
          description: HTTP status code.
          examples:
          - 400
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
          examples:
          - body/email Invalid email
        instance:
          type: string
          description: URI reference that identifies the specific occurrence.
          examples:
          - /requests/3fa85f64-5717-4562-b3fc-2c963f66afa6
      x-apidog-orders:
      - type
      - title
      - status
      - detail
      - instance
      x-apidog-ignore-properties: []
      x-apidog-folder: ''
    FunctionBreakdownItem_2:
      type: object
      required:
      - functionName
      - functionId
      - count
      - percentage
      properties:
        functionName:
          type: string
          description: Job function name (e.g., Engineering)
        functionId:
          type: string
          description: Job function ID
        count:
          type: integer
          description: Count of people in this function
        percentage:
          type: number
          description: Percentage of total
        seniorityBreakdown:
          type: array
          items:
            $ref: '#/components/schemas/SeniorityBreakdownItem_2'
          description: Nested seniority breakdown within this department
          nullable: true
      x-apidog-orders:
      - functionName
      - functionId
      - count
      - percentage
      - seniorityBreakdown
      x-apidog-ignore-properties: []
      x-apidog-folder: ''
    CountEstimateStatusResponse_2:
      type: object
      required:
      - success
      - data
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/CountEstimateStatusData_2'
        meta:
          type: object
          properties:
            requestId:
              type: string
            creditsRefunded:
              type: number
              description: Credits refunded (100, if job failed)
            creditsRemaining:
              type: number
              description: Remaining credit balance
          x-apidog-orders:
          - requestId
          - creditsRefunded
          - creditsRemaining
          x-apidog-ignore-properties: []
      x-apidog-orders:
      - success
      - data
      - meta
      x-apidog-ignore-properties: []
      x-apidog-folder: ''
