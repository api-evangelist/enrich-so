                  value:
                    success: true
                    data:
                      results: []
                      total_found: 0
                      total_returned: 0
                      cascade_stats:
                      - level: 0
                        candidates_found: 0
                        candidates_kept: 0
                    meta:
                      requestId: a7b2c3d4-e5f6-7890-abcd-ef1234567890
                      creditsUsed: 0
                      creditsRemaining: 1000000
          headers:
