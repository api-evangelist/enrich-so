                            last_name:
                              type: string
                              examples:
                              - Doe
                              nullable: true
                            full_name:
                              type: string
                              examples:
                              - John Doe
                              nullable: true
                            headline:
                              type: string
                              examples:
                              - Senior Software Engineer at Google
                              nullable: true
                            about_me:
                              type: string
                              nullable: true
                            location:
                              type: object
                              properties:
                                city:
                                  type: string
                                  examples:
                                  - San Francisco
                                  nullable: true
                                state_code:
                                  type: string
                                  examples:
                                  - CA
                                  nullable: true
                                country:
                                  type: string
                                  examples:
                                  - United States
                                  nullable: true
                                country_code:
                                  type: string
                                  examples:
                                  - US
                                  nullable: true
                                continent:
                                  type: string
                                  examples:
                                  - North America
                                  nullable: true
                              x-apidog-orders:
                              - city
                              - state_code
                              - country
                              - country_code
                              - continent
                              x-apidog-ignore-properties: []
                            linkedin_url:
                              type: string
                              examples:
                              - https://www.linkedin.com/in/johndoe
                              nullable: true
                            job_title:
                              type: string
                              examples:
                              - Senior Software Engineer
                              nullable: true
                            job_level:
                              type: string
                              examples:
                              - Senior
                              nullable: true
                            job_function:
                              type: string
                              examples:
                              - Engineering
                              nullable: true
                            job_is_current:
                              type: boolean
                              examples:
                              - true
                            education:
                              type: string
                              nullable: true
                            skills:
                              type: string
                              nullable: true
                            certifications:
                              type: string
                              nullable: true
                          x-apidog-orders:
                          - first_name
                          - last_name
                          - full_name
                          - headline
                          - about_me
                          - location
                          - linkedin_url
                          - job_title
                          - job_level
                          - job_function
                          - job_is_current
                          - education
                          - skills
                          - certifications
                          x-apidog-ignore-properties: []
                    x-apidog-orders:
                    - company_linkedin_url
                    - max_results
                    - results_length
                    - page
                    - total_pages
                    - total_results
                    - results
                    x-apidog-ignore-properties: []
                  meta:
                    type: object
                    properties:
                      requestId:
                        type: string
                        format: uuid
                      creditsUsed:
                        type: integer
                        description: Credits charged (1 per result returned, 0 if no results)
                      creditsRemaining:
                        type: integer
                        description: Remaining credit balance
                    x-apidog-orders:
                    - requestId
                    - creditsUsed
                    - creditsRemaining
                    x-apidog-ignore-properties: []
                x-apidog-orders:
                - success
                - data
                - meta
                x-apidog-ignore-properties: []
          headers:
            X-RateLimit-Limit:
              required: false
              schema:
                type: string
            X-RateLimit-Remaining:
              required: false
              schema:
                type: string
            X-RateLimit-Reset:
              required: false
              schema:
                type: string
          x-apidog-name: ''
        '400':
          description: Invalid request — check that company_linkedin_url is a valid LinkedIn company URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers: {}
          x-apidog-name: ''
        '401':
