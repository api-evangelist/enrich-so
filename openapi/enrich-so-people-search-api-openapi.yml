                        description: Current page number
                      total_pages:
                        type: integer
                        description: Total pages available
                      total_results:
                        type: integer
                        description: Total results matching filters
                      results:
                        type: array
                        items:
                          type: object
                          properties:
                            first_name:
                              type: string
                              examples:
                              - John
