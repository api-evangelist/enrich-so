components:
  schemas:
    LeadCountRequest:
      type: object
      required:
      - filters
      properties:
        filters:
          type: object
    LeadSearchRequest:
      type: object
      required:
      - filters
      properties:
        filters:
          type: object
          description: LeadFinderSearchFilters - person, organization, and technology filters.
        page:
          type: integer
          default: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
        excludeFilters:
          type: object
    ErrorEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
    LeadRevealRequest:
      type: object
      required:
      - leads
      properties:
        leads:
          type: array
          maxItems: 25
          items:
            type: object
            properties:
              id:
                type: string
        fields:
          type: array
          items:
            type: string
            enum:
            - email
            - phone
    LeadSearchResponse:
      type: object
      properties:
        success:
          type: boolean
        pagination:
          type: object
          properties:
            page:
              type: integer
            pageSize:
              type: integer
            total:
              type: integer
        data:
          type: array
          items:
            type: object
    LeadCountResponse:
      type: object
      properties:
        success:
          type: boolean
        count:
          type: integer
    LeadRevealResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            jobId:
              type: string
    LeadCountRequest_2:
      type: object
      required:
      - filters
      properties:
        filters:
          $ref: '#/components/schemas/LeadFinderSearchFilters'
        excludeFilters:
          type: object
          additionalProperties: false
          description: Filters to exclude from count. Only personHeadline, companyHeadline, aboutUs, domain, and jobTitle are supported.
          properties:
            personHeadline:
              oneOf:
              - type: string
              - type: array
                items:
                  type: string
                maxItems: 10
              description: Person LinkedIn headline to exclude (keyword/contains match)
            companyHeadline:
              oneOf:
              - type: string
              - type: array
                items:
                  type: string
                maxItems: 10
              description: Company headline to exclude (keyword/contains match)
            aboutUs:
              oneOf:
              - type: string
              - type: array
                items:
                  type: string
                maxItems: 10
              description: Company overview/about us to exclude (keyword/contains match)
            domain:
              oneOf:
              - type: string
              - type: array
                items:
                  type: string
                maxItems: 5000
              description: Company domain to exclude (exact match)
            jobTitle:
              oneOf:
              - type: string
              - type: array
                items:
                  type: string
                maxItems: 25
              description: Job title to exclude (keyword/contains match)
          x-apidog-orders:
          - personHeadline
          - companyHeadline
          - aboutUs
          - domain
          - jobTitle
          x-apidog-ignore-properties: []
      x-apidog-orders:
      - filters
      - excludeFilters
      x-apidog-ignore-properties: []
      x-apidog-folder: ''
    SavedSearchCreateRequest:
      type: object
      required:
      - name
      - filters
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Search name
        filters:
          $ref: '#/components/schemas/LeadFinderSearchFilters'
      x-apidog-orders:
      - name
      - filters
      x-apidog-ignore-properties: []
      x-apidog-folder: ''
    ErrorEnvelope_2:
      type: object
      description: RFC 9457 Problem Details error response.
      required:
      - type
      - title
      - status
      properties:
        type:
          type: string
          format: uri
          description: URI reference that identifies the problem type.
          examples:
          - https://dev.enrich.so/errors/validation-error
        title:
          type: string
          description: Short, human-readable summary of the problem.
          examples:
          - Validation Error
        status:
          type: integer
          description: HTTP status code.
          examples:
          - 400
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
          examples:
          - body/email Invalid email
        instance:
          type: string
          description: URI reference that identifies the specific occurrence.
          examples:
          - /requests/3fa85f64-5717-4562-b3fc-2c963f66afa6
      x-apidog-orders:
      - type
      - title
      - status
      - detail
      - instance
      x-apidog-ignore-properties: []
      x-apidog-folder: ''
    AsyncExportResponse:
      type: object
      description: Response returned immediately when an async export job is submitted
      required:
      - success
      - data
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required:
          - jobId
          - status
          - estimatedRows
          - estimatedCredits
          - creditsReserved
          - message
          properties:
            jobId:
              type: string
              description: Export job ID — poll GET /lead-finder/export-jobs/{jobId} for results
              examples:
              - ej_a1b2c3d4e5f6a7b8
            status:
              type: string
              enum:
              - pending
              description: Always `pending` on submission
            estimatedRows:
              type: number
              description: Estimated number of rows to export
            estimatedCredits:
              type: number
              description: Estimated credits to be consumed
            creditsReserved:
              type: number
              description: Credits reserved upfront for this export job
            message:
              type: string
              description: Human-readable confirmation message
              examples:
              - Export job queued. Poll GET /lead-finder/export-jobs/ej_a1b2c3d4e5f6a7b8 for status.
          x-apidog-orders:
          - jobId
          - status
          - estimatedRows
          - estimatedCredits
          - creditsReserved
          - message
          x-apidog-ignore-properties: []
        meta:
          type: object
          properties:
            requestId:
              type: string
              description: Unique request tracking ID
          x-apidog-orders:
          - requestId
          x-apidog-ignore-properties: []
      x-apidog-orders:
      - success
      - data
      - meta
      x-apidog-ignore-properties: []
      x-apidog-folder: ''
    LeadSearchResponse_2:
      type: object
      required:
      - success
      - data
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required:
          - results
          - pagination
          properties:
            results:
              type: array
              items:
                $ref: '#/components/schemas/LeadSearchPreviewResult'
              description: Array of search results
            pagination:
              $ref: '#/components/schemas/LeadFinderPagination'
              description: Pagination metadata
          x-apidog-orders:
          - results
          - pagination
          x-apidog-ignore-properties: []
        meta:
          type: object
          properties:
            requestId:
              type: string
              description: Request tracking ID
          x-apidog-orders:
          - requestId
          x-apidog-ignore-properties: []
      x-apidog-orders:
      - success
      - data
      - meta
      x-apidog-ignore-properties: []
      x-apidog-folder: ''
