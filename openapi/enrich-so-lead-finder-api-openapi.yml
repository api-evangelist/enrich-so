  /lead-finder/export-jobs:
    get:
      summary: List export jobs
      deprecated: false
      description: List recent CSV export jobs for your team (last 30 days). Paginated, optionally filtered
        by status.
      operationId: listExportJobs
      tags:
      - Lead Finder
      parameters:
      - name: page
        in: query
        description: 'Page number (default: 1)'
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: limit
        in: query
        description: 'Results per page (default: 20, max: 100)'
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: status
        in: query
        description: Filter by job status
        required: false
        schema:
          type: string
          enum:
          - pending
          - processing
          - completed
          - failed
      responses:
        '200':
          description: Paginated list of export jobs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadExportJobListResponse'
              example:
                success: true
                data:
                  jobs:
                  - jobId: ej_a1b2c3d4e5f6a7b8
                    status: completed
                    total: 500
                    processed: 500
                    creditsUsed: 24750
                    creditsRefunded: 250
                    createdAt: '2025-06-03T14:30:00.000Z'
                    completedAt: '2025-06-03T14:35:00.000Z'
                  total: 1
                  page: 1
                  limit: 20
          headers:
            X-RateLimit-Limit:
              required: false
              description: ''
              schema:
                type: string
            X-RateLimit-Remaining:
              required: false
              description: ''
              schema:
                type: string
            X-RateLimit-Reset:
              required: false
              description: ''
              schema:
                type: string
