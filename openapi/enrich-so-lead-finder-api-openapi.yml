          type: integer
          minimum: 1
          default: 1
          description: 'Page number (starts at 1). Offset-based cap: (page - 1) × pageSize must be < 500,000.
            Pages 1–3 are free.'
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
          description: Results per page (1–100)
