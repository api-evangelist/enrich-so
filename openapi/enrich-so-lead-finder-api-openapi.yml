        jobDescription:
          type: string
          description: Job description (exact match)
        jobLocationCity:
          type: string
          description: Job location city (exact match)
        jobLocationState:
          type: string
          description: Job location state (exact match)
        jobLocationCountry:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
            maxItems: 20
          description: Job location country (multi-select)
        jobIsCurrent:
          type: boolean
          description: Whether job is current position
        jobStartDate:
          type: string
          description: Job start date (exact match)
        jobCount:
          type: integer
          minimum: 0
          description: Min number of jobs in profile
        companyName:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
            maxItems: 25
          description: Company name from person record (multi-select, exact match via suggest)
        companyNameMode:
          type: string
