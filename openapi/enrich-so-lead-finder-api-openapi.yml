              type: integer
            limit:
              type: integer
    RevealJobPollResponse:
      type: object
      required:
      - success
      - data
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required:
          - jobId
          - status
          - jobType
          - fields
          - createdAt
          properties:
            jobId:
              type: string
              description: Reveal/enrich job ID
            status:
              type: string
              enum:
              - pending
              - processing
              - completed
              - failed
              description: '`pending` — queued, `processing` — worker running, `completed` — results ready,
                `failed` — credits refunded'
            jobType:
              type: string
              enum:
              - reveal
              - enrich
              description: Whether this was a reveal or enrich job
            fields:
              type: array
              items:
                type: string
                enum:
                - email
                - phone
              description: Contact fields that were requested
            progress:
              type: object
              description: Present for pending/processing/completed jobs
              properties:
                processed:
                  type: integer
                  description: Leads processed so far
                total:
                  type: integer
                  description: Total leads in the job
              nullable: true
            results:
              type: object
              description: Present only when status is `completed`
              properties:
                revealed:
                  type: array
                  items:
                    $ref: '#/components/schemas/RevealedContact'
                  description: Revealed contacts
                alreadyRevealed:
                  type: integer
                  description: Leads returned from cache (not re-charged)
                newlyRevealed:
                  type: integer
                  description: Leads newly revealed (charged)
                creditsUsed:
                  type: number
                  description: Credits deducted for this job
                creditsRefunded:
                  type: number
                  description: Credits refunded (e.g. for leads with no result)
                  nullable: true
              nullable: true
            error:
              type: string
              description: Error message — present only when status is `failed`
              nullable: true
            creditsRefunded:
              type: number
              description: Credits refunded on failure — present only when status is `failed`
              nullable: true
            createdAt:
              type: string
              format: date-time
              description: When the job was created
            completedAt:
              type: string
              format: date-time
              description: When the job finished — present when status is `completed`
              nullable: true
    RevealJobSubmitResponse:
      type: object
      required:
      - success
      - data
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required:
          - jobId
          - status
          - totalLeads
          - fields
          - creditsReserved
          - message
          properties:
            jobId:
              type: string
              description: Reveal/enrich job ID (starts with `rj_`)
              examples:
              - rj_a1b2c3d4e5f6g7h8
            status:
              type: string
              enum:
              - pending
              description: Always `pending` on submit
            totalLeads:
              type: integer
              description: Number of leads submitted
            fields:
              type: array
              items:
                type: string
                enum:
                - email
                - phone
              description: Which fields were requested
            creditsReserved:
              type: number
              description: Credits reserved upfront for this reveal/enrich job
            message:
              type: string
              description: Human-readable message with polling URL
        meta:
          type: object
          properties:
            requestId:
              type: string
