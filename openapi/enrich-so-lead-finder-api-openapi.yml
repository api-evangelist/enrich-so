          headers:
            Retry-After:
              required: false
              description: ''
              schema:
                type: string
          x-apidog-name: ''
        '500':
          description: Something went wrong on our end — try again in a moment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope_2'
          headers: {}
          x-apidog-name: ''
      security:
      - ApiKeyHeader: []
        x-apidog:
          schemeGroups:
          - id: 2HfKtAee7F00g0H_KKpoJ
            schemeIds:
            - ApiKeyHeader
          - id: QpoVpD3to-KzwpYEkxI6e
            schemeIds:
            - BearerToken
          required: true
          use:
            id: 2HfKtAee7F00g0H_KKpoJ
          scopes:
            QpoVpD3to-KzwpYEkxI6e: {}
      x-apidog-folder: Lead Finder
      x-apidog-status: released
      x-run-in-apidog: https://app.apidog.com/web/project/1189032/apis/api-29249239-run
    servers:
