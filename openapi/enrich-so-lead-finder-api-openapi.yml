      type: object
      additionalProperties: false
      description: Comprehensive search filters for unified lead finder. All fields are optional. Supports ~135 filter fields across person, organization, and insights dimensions.
      properties:
        firstName:
          type: string
          description: First name (exact match)
        lastName:
          type: string
          description: Last name (exact match)
        middleName:
          type: string
          description: Middle name (exact match)
        city:
          type: string
          description: Person city (exact match)
        stateName:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
            maxItems: 20
          description: State/province name (multi-select)
        stateCode:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
            maxItems: 20
          description: State/province code (multi-select)
        countryName:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
            maxItems: 20
          description: Country name (multi-select)
        countryCode:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
            maxItems: 20
          description: Country code (multi-select)
        continent:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
            maxItems: 7
          description: Continent (multi-select)
        countryRegion:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
            maxItems: 20
          description: Country region/area (multi-select)
        linkedinUrl:
          type: string
          description: LinkedIn profile URL (exact match)
        linkedinHeadline:
          type: string
          description: LinkedIn headline (exact match)
        personHeadline:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
            maxItems: 10
          description: Person LinkedIn headline (keyword/contains match, multi-select)
        companyHeadline:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
            maxItems: 10
          description: Company headline (keyword/contains match, multi-select)
        linkedinIndustry:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
            maxItems: 20
          description: LinkedIn industry (multi-select)
        logoUrl:
          type: string
          description: Person logo URL (exact match)
        emailDomain:
          type: string
          description: Email domain (exact match)
        emailAddress:
          type: string
          description: Email address (exact match)
        jobTitle:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
            maxItems: 25
          description: Job title (multi-select, exact match)
        jobFunction:
          oneOf:
          - type: string
          - type: array
            items:
