components:
  schemas:
    AsyncExportResponse:
      type: object
      description: Response returned immediately when an async export job is submitted
      required:
      - success
      - data
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required:
          - jobId
          - status
          - estimatedRows
          - estimatedCredits
          - creditsReserved
          - message
          properties:
            jobId:
              type: string
              description: Export job ID — poll GET /lead-finder/export-jobs/{jobId} for results
              examples:
              - ej_a1b2c3d4e5f6a7b8
            status:
              type: string
              enum:
              - pending
              description: Always `pending` on submission
            estimatedRows:
              type: number
              description: Estimated number of rows to export
            estimatedCredits:
              type: number
              description: Estimated credits to be consumed
            creditsReserved:
              type: number
              description: Credits reserved upfront for this export job
            message:
              type: string
              description: Human-readable confirmation message
              examples:
              - Export job queued. Poll GET /lead-finder/export-jobs/ej_a1b2c3d4e5f6a7b8 for status.
        meta:
          type: object
          properties:
            requestId:
              type: string
              description: Unique request tracking ID
    ErrorEnvelope:
      type: object
      description: RFC 9457 Problem Details error response.
      required:
      - type
      - title
      - status
      properties:
        type:
          type: string
          format: uri
          description: URI reference that identifies the problem type.
          examples:
          - https://dev.enrich.so/errors/validation-error
        title:
          type: string
          description: Short, human-readable summary of the problem.
          examples:
          - Validation Error
        status:
          type: integer
          description: HTTP status code.
          examples:
          - 400
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
          examples:
          - body/email Invalid email
        instance:
          type: string
          description: URI reference that identifies the specific occurrence.
          examples:
          - /requests/3fa85f64-5717-4562-b3fc-2c963f66afa6
    LeadCountRequest:
      type: object
      required:
      - filters
      properties:
        filters:
          $ref: '#/components/schemas/LeadFinderSearchFilters'
        excludeFilters:
          type: object
          additionalProperties: false
          description: Filters to exclude from count. Only personHeadline, companyHeadline, aboutUs, domain,
            and jobTitle are supported.
          properties:
            personHeadline:
              oneOf:
              - type: string
              - type: array
                items:
                  type: string
                maxItems: 10
              description: Person LinkedIn headline to exclude (keyword/contains match)
            companyHeadline:
              oneOf:
              - type: string
              - type: array
                items:
                  type: string
                maxItems: 10
              description: Company headline to exclude (keyword/contains match)
            aboutUs:
              oneOf:
              - type: string
              - type: array
                items:
                  type: string
                maxItems: 10
              description: Company overview/about us to exclude (keyword/contains match)
            domain:
              oneOf:
              - type: string
              - type: array
                items:
                  type: string
                maxItems: 5000
              description: Company domain to exclude (exact match)
            jobTitle:
              oneOf:
              - type: string
              - type: array
                items:
                  type: string
                maxItems: 25
              description: Job title to exclude (keyword/contains match)
    LeadCountResponse:
      type: object
      required:
      - success
      - data
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required:
          - count
          - searchType
          - isApproximate
          properties:
            count:
              type: integer
              description: 'Maximum pageable results. For <=10k: exact deduped count. For >10k: approximate
                count with 25% dedup discount. Capped at 500,000 to prevent excessive pagination. Equals
                searchedTotalResult when under 500k.'
            searchType:
              type: string
              enum:
              - people
              - company
              - unified
              description: Type of search performed
            isApproximate:
              type: boolean
              description: True when results exceed 10,000 — count is estimated with a 25% dedup discount
                instead of running an exact dedup query
            searchedTotalResult:
              type: integer
              description: Total leads matching your search. Same as count when under 500k. When count
                hits the 500k pagination cap, this field shows the raw total count without any discount
                or cap applied.
        meta:
          type: object
          properties:
            requestId:
              type: string
    LeadEnrichRequest:
      type: object
      required:
      - leads
      - fields
      properties:
        leads:
          type: array
          minItems: 1
          maxItems: 25
          items:
            type: object
            required:
            - id
            properties:
              id:
                type: string
                description: Lead ID from search results
          description: Leads to enrich (max 25)
        fields:
          type: array
          minItems: 1
          items:
            type: string
            enum:
            - email
            - phone
          description: Which contact fields to reveal
    LeadExportJobListResponse:
      type: object
      description: Paginated list of export jobs for the team
      required:
      - success
      - data
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required:
          - jobs
          - total
          - page
          - limit
          properties:
            jobs:
              type: array
              items:
                $ref: '#/components/schemas/LeadExportJobSummary'
              description: List of export job summaries
            total:
              type: number
              description: Total number of jobs matching the query
            page:
              type: number
              description: Current page number
            limit:
              type: number
              description: Results per page
    LeadExportJobStatusResponse:
      type: object
      description: Export job status response. Single flat object — all fields always present.
      required:
      - success
      - data
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required:
          - jobId
          - name
          - status
          - phase
          - progress
          - totalRows
          - processedRows
          - creditsUsed
          - creditsRefunded
          - error
          - downloadUrl
          - createdAt
          - completedAt
          properties:
            jobId:
              type: string
              description: Export job ID
              examples:
              - ej_a1b2c3d4e5f6a7b8
            name:
              type: string
              description: Display name for the export job
            status:
              type: string
              enum:
              - pending
              - processing
              - completed
              - failed
              description: Current job status
            phase:
              type: string
              enum:
              - queued
              - fetching
              - enriching
              - generating
              - uploading
              description: Current processing phase
            progress:
              type: number
              description: Progress percentage 0-100
            totalRows:
              type: number
              description: Total rows (actual if available, otherwise estimated)
            processedRows:
              type: number
              description: Rows processed so far
            creditsUsed:
              type: number
              description: Credits consumed
            creditsRefunded:
              type: number
              description: Credits refunded
            error:
              type: string
              description: Error message (null unless failed)
              nullable: true
            downloadUrl:
              type: string
              description: Pre-signed download URL (only for completed jobs)
              nullable: true
            createdAt:
              type: string
              format: date-time
              description: Job creation timestamp (ISO 8601)
            completedAt:
              type: string
              format: date-time
              description: Job completion timestamp (ISO 8601), null if not yet complete
              nullable: true
