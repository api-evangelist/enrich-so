          description: Certifications (exact match)
        patents:
          type: string
          description: Patents (exact match)
        publications:
          type: string
          description: Publications (exact match)
        websites:
          type: string
          description: Websites (exact match)
        education:
          type: string
          description: Education (exact match)
        phone:
          type: string
          description: Phone number (exact match)
        cellphone:
          type: string
          description: Cellphone number (exact match)
        orgName:
          type: string
          description: Organization name (exact match)
