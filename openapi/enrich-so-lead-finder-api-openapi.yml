    RevealJobPollResponse:
      type: object
      required:
      - success
      - data
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required:
          - jobId
          - status
          - jobType
          - fields
          - createdAt
          properties:
            jobId:
              type: string
              description: Reveal/enrich job ID
            status:
              type: string
              enum:
              - pending
              - processing
              - completed
              - failed
              description: '`pending` — queued, `processing` — worker running, `completed` — results ready, `failed` — credits refunded'
            jobType:
              type: string
              enum:
              - reveal
              - enrich
              description: Whether this was a reveal or enrich job
            fields:
              type: array
              items:
                type: string
                enum:
                - email
                - phone
              description: Contact fields that were requested
            progress:
              type: object
              description: Present for pending/processing/completed jobs
              properties:
                processed:
                  type: integer
                  description: Leads processed so far
                total:
                  type: integer
                  description: Total leads in the job
              x-apidog-orders:
              - processed
              - total
              x-apidog-ignore-properties: []
              nullable: true
            results:
              type: object
              description: Present only when status is `completed`
              properties:
                revealed:
                  type: array
                  items:
                    $ref: '#/components/schemas/RevealedContact'
                  description: Revealed contacts
                alreadyRevealed:
                  type: integer
                  description: Leads returned from cache (not re-charged)
                newlyRevealed:
                  type: integer
                  description: Leads newly revealed (charged)
                creditsUsed:
                  type: number
                  description: Credits deducted for this job
                creditsRefunded:
                  type: number
                  description: Credits refunded (e.g. for leads with no result)
                  nullable: true
              x-apidog-orders:
              - revealed
              - alreadyRevealed
              - newlyRevealed
              - creditsUsed
              - creditsRefunded
              x-apidog-ignore-properties: []
              nullable: true
            error:
              type: string
              description: Error message — present only when status is `failed`
              nullable: true
            creditsRefunded:
              type: number
              description: Credits refunded on failure — present only when status is `failed`
              nullable: true
            createdAt:
              type: string
              format: date-time
              description: When the job was created
            completedAt:
              type: string
              format: date-time
              description: When the job finished — present when status is `completed`
              nullable: true
          x-apidog-orders:
          - jobId
          - status
          - jobType
          - fields
          - progress
          - results
          - error
          - creditsRefunded
          - createdAt
          - completedAt
          x-apidog-ignore-properties: []
      x-apidog-orders:
      - success
      - data
      x-apidog-ignore-properties: []
      x-apidog-folder: ''
