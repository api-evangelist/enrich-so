      x-apidog-status: released
      x-run-in-apidog: https://app.apidog.com/web/project/1189032/apis/api-27728073-run
components:
  schemas:
    ErrorEnvelope:
      type: object
      description: RFC 9457 Problem Details error response.
      required:
      - type
      - title
      - status
      properties:
        type:
          type: string
          format: uri
          description: URI reference that identifies the problem type.
          examples:
          - https://dev.enrich.so/errors/validation-error
        title:
          type: string
          description: Short, human-readable summary of the problem.
          examples:
          - Validation Error
        status:
          type: integer
          description: HTTP status code.
          examples:
          - 400
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
          examples:
          - body/email Invalid email
        instance:
          type: string
          description: URI reference that identifies the specific occurrence.
          examples:
          - /requests/3fa85f64-5717-4562-b3fc-2c963f66afa6
      x-apidog-orders:
      - type
      - title
      - status
      - detail
      - instance
      x-apidog-ignore-properties: []
      x-apidog-folder: ''
    FollowerProfile:
      type: object
      required:
      - profileUrl
      properties:
        objectURN:
          type: string
          description: LinkedIn profile URN identifier
        name:
          type: string
          description: Full name
          nullable: true
        firstName:
          type: string
          description: First name
          nullable: true
        lastName:
          type: string
          description: Last name
          nullable: true
        profileUrl:
          type: string
          description: LinkedIn profile URL
        profilePictureUrl:
          type: string
          description: Profile picture URL
          nullable: true
        title:
          type: string
          description: Job title
          nullable: true
        companyName:
          type: string
          description: Current company name
          nullable: true
        companyProfileUrl:
          type: string
          description: Company LinkedIn URL
          nullable: true
        companyWebsite:
          type: string
          description: Company website URL
          nullable: true
        companyDomain:
          type: string
          description: Company domain
          nullable: true
        companyLogoUrl:
          type: string
          description: Company logo URL
          nullable: true
