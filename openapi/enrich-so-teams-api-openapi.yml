            schemeIds:
            - BearerToken
          required: true
          use:
            id: ITulbGf-iaBy1jastxLFZ
          scopes:
            MRl9ot_U0Hi0CGtsoDsHI: {}
      x-apidog-folder: Teams
      x-apidog-status: released
      x-run-in-apidog: https://app.apidog.com/web/project/1189032/apis/api-27483209-run
components:
  schemas:
    InvitationListResponse:
      type: object
      required:
      - success
      - data
      properties:
        success:
          type: boolean
          const: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/Invitation'
      x-apidog-orders:
      - success
      - data
      x-apidog-ignore-properties: []
      x-apidog-folder: ''
    Invitation:
      type: object
      required:
      - id
      - email
      - role
      - status
      - expiresAt
      - createdAt
      properties:
        id:
          type: string
          examples:
          - 665e2e7f4a6d8c001abc5001
        email:
          type: string
          format: email
          description: Who was invited
          examples:
          - marco.silva@yourcompany.com
        role:
          type: string
          enum:
          - admin
          - member
          description: The role they'll have when they accept
          examples:
          - member
        status:
          type: string
          const: pending
          description: Invitation status (always `pending` for outstanding invitations)
        expiresAt:
          type: string
          format: date-time
          description: When the invitation expires
          examples:
          - '2025-07-03T15:00:00.000Z'
        createdAt:
          type: string
          format: date-time
          description: When the invitation was sent
          examples:
          - '2025-06-03T15:00:00.000Z'
      x-apidog-orders:
      - id
      - email
      - role
      - status
      - expiresAt
      - createdAt
      x-apidog-ignore-properties: []
      x-apidog-folder: ''
    InvitationResponse:
      type: object
      required:
      - success
      - data
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/Invitation'
      x-apidog-orders:
      - success
      - data
      x-apidog-ignore-properties: []
      x-apidog-folder: ''
    ErrorEnvelope:
      type: object
      description: RFC 9457 Problem Details error response.
      required:
      - type
      - title
      - status
      properties:
        type:
          type: string
          format: uri
          description: URI reference that identifies the problem type.
          examples:
          - https://dev.enrich.so/errors/validation-error
        title:
          type: string
          description: Short, human-readable summary of the problem.
          examples:
          - Validation Error
        status:
          type: integer
          description: HTTP status code.
          examples:
          - 400
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
          examples:
          - body/email Invalid email
        instance:
          type: string
          description: URI reference that identifies the specific occurrence.
          examples:
          - /requests/3fa85f64-5717-4562-b3fc-2c963f66afa6
      x-apidog-orders:
      - type
      - title
      - status
      - detail
      - instance
      x-apidog-ignore-properties: []
      x-apidog-folder: ''
    TeamMember:
      type: object
      required:
      - id
      - userId
      - email
      - name
      - role
      - createdAt
      properties:
        id:
          type: string
          description: Membership ID
          examples:
          - 665e2a104a6d8c001abc4001
        userId:
          type: string
          description: User ID
          examples:
          - 665e2a104a6d8c001abc4101
        email:
          type: string
          format: email
          description: The member's email address
          examples:
          - sarah.chen@yourcompany.com
        name:
          type: string
          description: The member's display name
          examples:
          - Sarah Chen
          nullable: true
        role:
          type: string
          enum:
          - owner
          - admin
          - member
          description: 'Their role in the team:

            - `owner` — full control, cannot be removed

            - `admin` — can manage members and keys

            - `member` — can use the API

            '
          examples:
          - admin
        createdAt:
          type: string
          format: date-time
          description: When they joined the team
          examples:
          - '2025-01-15T09:00:00.000Z'
      x-apidog-orders:
      - id
      - userId
      - email
      - name
      - role
      - createdAt
      x-apidog-ignore-properties: []
      x-apidog-folder: ''
    InviteBody:
      type: object
      required:
      - email
      - role
      properties:
        email:
          type: string
          format: email
          description: The email address of the person you want to invite
          examples:
          - marco.silva@yourcompany.com
        role:
          type: string
          enum:
          - admin
          - member
          description: The role to assign them
          examples:
          - member
      x-apidog-orders:
      - email
      - role
      x-apidog-ignore-properties: []
      x-apidog-folder: ''
    SuccessOperationResponse:
      type: object
      required:
      - success
      - data
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required:
          - success
          properties:
            success:
              type: boolean
          x-apidog-orders:
          - success
          x-apidog-ignore-properties: []
      x-apidog-orders:
      - success
      - data
      x-apidog-ignore-properties: []
      x-apidog-folder: ''
    TeamMemberListResponse:
      type: object
      required:
      - success
      - data
      properties:
        success:
          type: boolean
          const: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/TeamMember'
      x-apidog-orders:
      - success
      - data
      x-apidog-ignore-properties: []
      x-apidog-folder: ''
  securitySchemes:
    apiKey:
      type: apikey
      name: x-api-key
      in: header
      description: 'Your API key. Keys start with `sk_live_` and are 64 characters long.

        '
    bearerAuth:
      type: bearer
      scheme: bearer
      description: 'Alternative — send the same key as a Bearer token:

        `Authorization: Bearer sk_live_...`

        '
    ApiKeyHeader:
      type: apikey
      in: header
      name: x-api-key
      description: API key starting with `sk_live_` (64 characters). Get yours from the [Enrich Dashboard](https://sendkit.ai/dashboard/api-keys).
    BearerToken:
      type: bearer
      scheme: bearer
      description: Same `sk_live_` key passed as a Bearer token in the Authorization header.
