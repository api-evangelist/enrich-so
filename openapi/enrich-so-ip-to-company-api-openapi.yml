              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                x-apidog-orders:
                - error
                - message
                x-apidog-ignore-properties: []
              example:
                error: Unauthorized
                message: The API key provided is invalid or has been revoked
                statusCode: 401
          headers: {}
          x-apidog-name: Unauthorized
        '402':
