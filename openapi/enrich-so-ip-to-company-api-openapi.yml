              example:
                type: https://dev.enrich.so/errors/validation-error
                title: Validation Error
                status: 400
                detail: '"ips" must be a non-empty array'
                instance: /requests/3fa85f64-5717-4562-b3fc-2c963f66afa6
          headers: {}
          x-apidog-name: Bad Request
        '401':
          description: Your API key is missing or invalid
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                x-apidog-orders:
                - error
                - message
                x-apidog-ignore-properties: []
              example:
                error: Unauthorized
                message: The API key provided is invalid or has been revoked
                statusCode: 401
          headers: {}
          x-apidog-name: Unauthorized
        '402':
          description: You don’t have enough credits — `detail.required` shows how many are needed
