paths:
  /ip-to-company:
    post:
      summary: Resolve company from IP
      deprecated: false
      description: 'Resolves company, organization, and geolocation info from an IP address. Results are cached for 7 days.


        **Cost:** 100 credits. You are **not** charged if no domain is found (i.e. `ipDomain` is absent from the response).'
      operationId: ipToCompany
      tags:
      - IP to Company
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - ip
              properties:
                ip:
                  type: string
                  minLength: 1
                  maxLength: 45
                  description: IPv4 or IPv6 address to look up
              x-apidog-orders:
              - ip
              x-apidog-ignore-properties: []
            example:
              ip: 8.8.8.8
      responses:
        '200':
          description: Domain resolved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      searchIp:
                        type: string
                      ipDomain:
                        type: string
                      ipOrganization:
                        type: string
                      ipCountryName:
                        type: string
                      ipCountryCode:
                        type: string
                      ipRegionName:
                        type: string
                      ipCity:
                        type: string
                      ipSubContinent:
                        type: string
                      ipLatitude:
                        type: number
                      ipLongitude:
                        type: number
                      ipTimezone:
                        type: string
                      ipIsp:
                        type: string
                      ipRange:
                        type: string
                      ipUsageType:
                        type: string
                    x-apidog-orders:
                    - searchIp
                    - ipDomain
                    - ipOrganization
                    - ipCountryName
                    - ipCountryCode
                    - ipRegionName
                    - ipCity
                    - ipSubContinent
                    - ipLatitude
                    - ipLongitude
                    - ipTimezone
                    - ipIsp
                    - ipRange
                    - ipUsageType
                    x-apidog-ignore-properties: []
                  meta:
                    type: object
                    properties:
                      requestId:
                        type: string
                      creditsUsed:
                        type: integer
                      creditsRemaining:
                        type: integer
                    x-apidog-orders:
                    - requestId
                    - creditsUsed
                    - creditsRemaining
                    x-apidog-ignore-properties: []
                x-apidog-orders:
                - success
                - data
                - meta
                x-apidog-ignore-properties: []
              example:
                success: true
                data:
                  searchIp: 8.8.8.8
                  ipDomain: google.com
                  ipOrganization: Google LLC
                  ipCountryName: United States
                  ipCountryCode: US
                  ipRegionName: California
                  ipCity: Mountain View
                  ipSubContinent: Northern America
                  ipLatitude: 37.386
                  ipLongitude: -122.0838
                  ipTimezone: America/Los_Angeles
                  ipIsp: Google LLC
                  ipRange: 8.8.8.0/24
                  ipUsageType: DCH
                meta:
                  requestId: 664f2b3c9a1e4d0012abcdef
                  creditsUsed: 100
                  creditsRemaining: 4900
          headers:
            X-RateLimit-Limit:
              schema:
                type: string
            X-RateLimit-Remaining:
              schema:
                type: string
            X-RateLimit-Reset:
              schema:
                type: string
          x-apidog-name: OK
        '400':
          description: Something is wrong with the request — check the `detail` field for specifics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                type: https://dev.enrich.so/errors/validation-error
                title: Validation Error
                status: 400
                detail: '"ip" must be a non-empty string'
                instance: /requests/3fa85f64-5717-4562-b3fc-2c963f66afa6
          headers: {}
          x-apidog-name: Bad Request
        '401':
          description: Your API key is missing or invalid
          content:
