              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                x-apidog-orders:
                - error
                - message
                x-apidog-ignore-properties: []
              example:
                error: Payment Required
                message: 'Not enough credits. Required: 100, available: 0'
                statusCode: 402
          headers: {}
          x-apidog-name: Payment Required
        '429':
          description: You’ve sent too many requests — wait and try again
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
