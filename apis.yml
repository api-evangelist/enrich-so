  description: 'The prior major version of the Enrich API, still live at api.enrich.so and still serving
    its own Swagger UI at https://api.enrich.so/docs. Two operations: GET /v1/api/auth returns the account/credit
    context for a JWT bearer token, and GET /v2/api/person enriches a person from an email address. Superseded
    by the v3 API at dev.enrich.so/api/v3, but no deprecation notice or sunset date has been published.'
