aid: enrich-so
url: https://raw.githubusercontent.com/api-evangelist/enrich-so/refs/heads/main/apis.yml
name: Enrich
kind: company
description: Enrich (enrich.so), operated by Enrich Labs, is a person and company data enrichment API
  for B2B go-to-market, sales, and web intelligence teams. From a single REST interface at https://dev.enrich.so/api/v3
  it resolves a professional profile from an email address (reverse email lookup), finds and verifies
  professional email addresses, finds mobile and phone numbers, resolves a company and geolocation from
  an IP address, searches a lead-finder database of people and organizations, finds employees at a company,
  and scrapes LinkedIn company followers. Fifty-one operations across nine products, every one of them
  metered against a single prepaid credit balance and refunded when a lookup finds nothing. Every bulk
  product follows one submit/poll/results shape with reserve-and-settle billing, ten typed webhook callbacks,
  RFC 9457 problem details on every error, and official TypeScript and Go SDKs. Enrich also operates a
  first-party remote MCP server at mcp.enrich.so with OAuth 2.0 and dynamic client registration.
