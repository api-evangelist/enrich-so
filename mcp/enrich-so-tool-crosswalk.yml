description: 'Crosswalk between the Enrich remote MCP server and the Enrich REST API v3. Enrich ships
  BOTH surfaces, but only one of them is readable: the REST contract is fully published (49 paths / 51
  operations, harvested from the OpenAPI fragments Enrich embeds in every documentation page), while the
  MCP tool list is authenticated and is not documented anywhere. So crosswalk[] is deliberately EMPTY
  — binding a tool to an operationId without having seen the tool would be a guess, and a guessed binding
  is worse than a recorded gap. rest_only[] below is the complete REST surface an authenticated tools/list
  should be reconciled against; every row an Enrich tool covers moves out of rest_only and into crosswalk
  on the next authenticated pass.'
