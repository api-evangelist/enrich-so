description: >-
  Enrich publishes NO API changelog. There is no changelog, release-notes, what's-new or
  versioning page anywhere in the documentation sitemap (https://doc.enrich.so/sitemap.xml,
  probed 2026-08-14 — 183 pages, none of them a changelog), no changelog in llms.txt, and
  the marketing site is unreadable to any non-browser client (429, Vercel Security
  Checkpoint). The only dated, first-party record of change Enrich publishes is the
  release history of its official TypeScript SDK. That is what is captured here, and it is
  recorded as an SDK changelog, not an API changelog — it tracks when client support for
  a capability shipped, which lags the API itself by an unknown amount.
api_changelog:
  published: false
  probed:
