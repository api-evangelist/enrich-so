  - url: https://www.enrich.so/changelog
    status: 429
    finding: Vercel Security Checkpoint bot challenge; unmeasurable
  consequence: >-
    A consumer has no way to learn that an endpoint changed. Combined with the absent
    deprecation policy (lifecycle/enrich-so-lifecycle.yml), change on this API is
    undiscoverable until something breaks.
