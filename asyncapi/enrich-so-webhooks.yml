volume_warning: >-
  Per-result callbacks are 1:1 with items. A 500,000-email batch validation job with a
  webhookUrl set will POST your endpoint 500,000 times plus one completion. Size the
  receiver accordingly, or omit webhookUrl and poll the results endpoint instead
  (polling is free).
