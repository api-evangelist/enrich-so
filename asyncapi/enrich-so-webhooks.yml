provider: Enrich
providerId: enrich-so
description: >-
  Enrich publishes a real, typed webhook surface: ten callbacks covering five batch
  products, each with a per-result callback that fires once per item and a completion
  callback that fires exactly once when the job finishes. Enrich does NOT publish an
  AsyncAPI document, so this is the webhook catalogue rather than an AsyncAPI spec. The
  callbacks ARE, however, declared as OpenAPI 3.1 `webhooks` with full JSON Schemas on
  Enrich's own documentation pages, which is a stronger position than most webhook
  providers — the payload shapes are machine-readable even though the event catalogue is
  not.
asyncapi_published: false
asyncapi_note: >-
  No AsyncAPI document is served anywhere on enrich.so (probed /asyncapi.yaml,
  /asyncapi.json on dev.enrich.so and doc.enrich.so — 404). Not fabricated here.
delivery:
  transport: https-post
  registration: >-
    Per-job, not per-account. There is no webhook management API and no dashboard
    subscription model — you pass an optional `webhookUrl` string in the body of each
    batch submit, and Enrich POSTs to it for that job only.
  registration_field: webhookUrl
  acknowledgement: Return any 2xx to acknowledge receipt.
  retries: not documented
  ordering: not guaranteed (per-result callbacks fire as each item completes)
  signing:
    supported: false
    header: null
    note: >-
      NO payload signature. Enrich documents no signing secret, no HMAC header and no
      timestamp-tolerance rule for any of the ten callbacks, and none of the published
      webhook fragments declares a security scheme on the callback itself. A receiver
      cannot cryptographically verify that a POST came from Enrich, and the payloads
      carry personal data (names, work emails, phone numbers, LinkedIn profiles). Mitigate
      with an unguessable webhookUrl per job plus source-IP allowlisting, and treat the
      body as untrusted until re-fetched from the results endpoint. This is the single
      most consequential gap in the Enrich event surface.
envelope:
  fields:
  - name: event
    description: Event type string.
  - name: timestamp
    description: ISO 8601 UTC timestamp.
  - name: data
    description: Event payload; shape depends on the event.
  - name: batchId
    description: Present on the Company Followers callbacks only.
  inconsistency: >-
    Event naming is not uniform. Eight of the ten events use a "webhook:<thing>.completed"
    prefix, but the two Email Finder / Email Validation COMPLETION events use bare
    "finder.completed" and "validation.completed". A consumer matching on a prefix will
    silently drop the two completion events that matter most.
events:
