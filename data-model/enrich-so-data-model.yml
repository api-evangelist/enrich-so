observations:
- >-
  No stable person or company identifier is issued. Every result is keyed by the input you
  supplied (email, profile URL, IP, domain). You cannot re-fetch an enrichment by ID, only
  re-run and re-pay for it — except where Enrich caches: IP-to-company results are cached
  7 days, reverse lookups 7 days, and cached lead reveals are free.
- >-
  Nine near-identical job families with nine near-identical schema sets is the largest
  design cost in this model. One generic Job resource with a `type` discriminator would
  collapse roughly a third of the 115 schemas.
- >-
  Field naming is inconsistent across products: the reverse-lookup result uses snake_case
  (position_history, education_history) while the envelope and batch schemas use camelCase
  (creditsUsed, totalPages, batchId). A single client has to handle both.
