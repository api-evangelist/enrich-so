description: >-
  FinOps view of Enrich spend. Enrich bills a prepaid, credit-metered model: you buy credits
  (via a monthly plan or top-up) and each API call debits credits by endpoint. Confirmed
  per-call costs are 1 credit for email validation, 10 for email finding, 10 for reverse
  email lookup (person enrichment), 100 for IP-to-company, 500 for phone finding, 10/525/535
  for lead reveal (email/phone/both), and 1 credit per returned result for lead search beyond
  the free page allowance. Unsuccessful ("not found") lookups and cached results are not
  charged, so effective cost tracks successful matches rather than raw call volume.
notes: >-
  RECONCILED 2026-08-14. Per-endpoint credit costs are read from the OpenAPI fragments
  Enrich publishes on each endpoint documentation page, and the credit-pack prices from
  https://doc.enrich.so/credits-pricing-1951027m0, which also states the effective rate per
  credit: Growth $0.00049, Scale $0.000298, Pro $0.0002. CORRECTION: an earlier round
  recorded lead reveal at 50/525/575 credits; the published contract says 10/525/535 and
  the earlier figures have been replaced. Enrich's own pricing page could not be read —
  https://www.enrich.so/pricing returns 429 behind a Vercel Security Checkpoint bot
  challenge for every non-browser client — so no list price for the Enterprise tier is
  recorded.
