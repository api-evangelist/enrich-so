description: >-
  Enrich enforces global per-account rate limits that scale with your plan, expressed as a
  burst limit (requests per second) and a sustained limit (requests per minute averaged
  over a 60 second window). Enrichment and bulk endpoints carry tighter per-endpoint
  overrides than the global limit. Every response returns X-RateLimit-Limit,
  X-RateLimit-Remaining, and X-RateLimit-Reset headers; exceeding a limit returns HTTP 429
  with a Retry-After header. The tier values below are captured from the Enrich rate-limits
  documentation and should be reconciled against the live docs, which control.
notes: >-
  RECONCILED 2026-08-14 against https://doc.enrich.so/rate-limits-1951030m0, which publishes
  the full per-plan table plus two endpoint-category overrides with real numbers — those
  overrides were previously recorded only as "stricter than global" and are now itemised
  below. The three X-RateLimit-* headers and Retry-After are additionally confirmed as
  declared response headers on 66 and 50 operations respectively in the OpenAPI fragments
  Enrich publishes on its endpoint pages. Note the header naming is the legacy X-prefixed
  form, not the IETF RateLimit-Limit/Remaining/Reset fields, and X-RateLimit-Reset carries
  SECONDS UNTIL RESET rather than a UNIX timestamp.
