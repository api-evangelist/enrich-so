headerSemantics:
- header: X-RateLimit-Limit
  meaning: Maximum requests allowed in the current window.
- header: X-RateLimit-Remaining
  meaning: Requests remaining in the current window. Pace against this rather than waiting for the 429.
- header: X-RateLimit-Reset
  meaning: SECONDS until the window resets. Not a UNIX timestamp.
- header: Retry-After
  meaning: Seconds to wait before retrying, returned on 429.
scope: >-
  Limits are applied per ORGANIZATION (the team behind the API key), not per key. Issuing
  additional keys does not buy additional throughput — it only separates cost attribution.
policies:
- name: Enterprise Exemption
  description: Enterprise plans have no endpoint-specific overrides; the global limits apply.
- name: Tiered Limits
  description: Burst and sustained limits increase from Free through Growth, Scale, Pro, and Enterprise plans.
- name: Backoff Strategy
  description: On 429, honor the Retry-After header and implement exponential backoff with jitter.
- name: Rate Limit Headers
  description: Read X-RateLimit-Remaining and X-RateLimit-Reset to pace client throughput proactively.
