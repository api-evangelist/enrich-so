description: >-
  Versioning, deprecation and operational-transparency posture for the Enrich API. Enrich
  versions in the URI path and runs a public status page, but publishes no deprecation
  policy, no Sunset/Deprecation headers, no SLA and no changelog — while continuing to
  serve a prior major version with no announced end of life.
