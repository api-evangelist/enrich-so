  deprecated_operations: []
  evidence: >-
    No operation in the 51-operation v3 surface carries deprecated:true, no Sunset or
    Deprecation response header is declared anywhere, and the documentation sitemap
    (https://doc.enrich.so/sitemap.xml, probed 2026-08-14) contains no versioning,
    deprecation, migration or changelog page. NO Deprecation pointer is emitted in
    apis.yml because there is no policy to point at.
  gap: >-
    The legacy v1/v2 API is the concrete cost of this. It is live, documented by its own
    Swagger UI, and its root response still advertises a docs host — https://docs.enrich.so
    — that does not resolve at all (DNS failure, probed 2026-08-14; the real docs host is
    doc.enrich.so, singular). A consumer on v1/v2 has no announced migration date and a
    broken pointer to the migration target.
