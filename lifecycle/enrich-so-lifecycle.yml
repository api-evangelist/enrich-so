      {"message":"Welcome to the Enrich API","version":"2.0.0","docs":"https://docs.enrich.so"}
      and https://api.enrich.so/docs still serves a Swagger UI carrying an OpenAPI 3.0.0
      document titled "Enrich Labs API" with GET /v1/api/auth and GET /v2/api/person.
    deprecation_notice: none published
